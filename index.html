<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>НУЛЬОВИЙ СИГНАЛ</title>
    <style>
        body {
            background-color: #050505;
            color: #c9d1d9;
            font-family: 'Courier New', Courier, monospace;
            padding: 15px;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        h1 { color: #ff3333; font-size: 18px; text-align: center; }
        .box {
            background: #0d1117;
            border: 1px solid #1f6feb;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        button {
            background: #161b22;
            color: #58a6ff;
            border: 1px solid #30363d;
            padding: 12px;
            width: 100%;
            margin-bottom: 10px;
            font-family: inherit;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
            text-align: left;
        }
        button:active { background: #30363d; }
    </style>
</head>
<body>
    <h1>ОБ'ЄКТ-31 // СИГНАЛ</h1>
    
    <div class="box">
        <div id="room-desc">Ви стоїте біля зачиненого вхідного шлюзу. Аварійне світло ледь блимає червоним. У повітрі пахне озоном.</div>
    </div>

    <div id="actions">
        <button onclick="goTo('guard')">➡️ Піти до кімнати чергового</button>
        <button onclick="searchGate()">🔍 Оглянути підлогу у шлюзі</button>
    </div>

    <script>
        function goTo(room) {
            const desc = document.getElementById('room-desc');
            const act = document.getElementById('actions');
            
            if(room === 'guard') {
                document.querySelector('h1').innerText = "КІМНАТА ЧЕРГОВОГО";
                desc.innerText = "Екрани розбиті. На столі мерехтить термінал і лежить ключ.";
                act.innerHTML = `
                    <button onclick="takeKey()">🔑 Взяти ключ доступу</button>
                    <button onclick="goTo('gate')">⬅️ Повернутися у шлюз</button>
                `;
            } else if(room === 'gate') {
                document.querySelector('h1').innerText = "ВХІДНИЙ ШЛЮЗ";
                desc.innerText = "Ви повернулися до вхідного шлюзу.";
                act.innerHTML = `
                    <button onclick="goTo('guard')">➡️ Піти до кімнати чергового</button>
                    <button onclick="searchGate()">🔍 Оглянути підлогу у шлюзі</button>
                `;
            }
        }

        function searchGate() {
            alert("Ви знайшли пожовклий службовий запис: код розблокування дверей — 4815.");
        }

        function takeKey() {
            alert("Ви підібрали ключ! Тепер можна відкрити лабораторію.");
        }
    </script>
</body>
</html>
