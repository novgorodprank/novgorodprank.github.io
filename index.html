<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#06080d">
<title>УСТАНОВА №31</title>
<style>
:root{--bg:#06080d;--panel:#0d1117;--border:#30363d;--text:#c9d1d9;--red:#f85149;--green:#3fb950;--yellow:#d29922;--blue:#58a6ff;--purple:#bc8cff;--muted:#8b949e;--orange:#db6d28}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Courier New',Courier,monospace;display:flex;flex-direction:column;max-width:480px;margin:0 auto;padding:6px;padding-bottom:env(safe-area-inset-bottom,6px)}
header{background:var(--panel);border:2px solid var(--blue);border-radius:6px;padding:8px 10px;text-align:center;margin-bottom:5px;flex-shrink:0}
h1{font-size:13px;color:var(--yellow);letter-spacing:.4px}
#time-phase{font-size:10px;color:var(--yellow);margin-top:2px;opacity:.9}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px;margin-bottom:5px;font-size:10px;flex-shrink:0}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:4px 6px;display:flex;flex-direction:column;gap:2px}
.stat-top{display:flex;justify-content:space-between;align-items:center}
.stat b{font-weight:700}
.bar{height:3px;background:#21262d;border-radius:2px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:2px;transition:width .35s}
.screen{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:10px;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;margin-bottom:5px}
.loc-title{font-size:12px;color:var(--blue);text-transform:uppercase;border-bottom:1px dashed var(--border);padding-bottom:4px;margin-bottom:6px;flex-shrink:0}
.desc{font-size:11px;line-height:1.4;color:#b1bac4;margin-bottom:8px;overflow-y:auto;flex-shrink:1;max-height:95px}
.actions{display:flex;flex-direction:column;gap:5px;overflow-y:auto;flex:1;min-height:0;padding-bottom:2px}
button{background:#161b22;color:var(--text);border:1px solid var(--border);padding:10px 11px;text-align:left;font-family:inherit;font-size:11px;border-radius:5px;cursor:pointer;line-height:1.25;width:100%}
button:active{background:#30363d;border-color:var(--blue);transform:scale(.98)}
button.primary{border-color:var(--blue);color:var(--blue)}
button.danger{border-color:var(--red);color:var(--red)}
button.special{border-color:var(--purple);color:var(--purple)}
button.success{border-color:var(--green);color:var(--green)}
button.muted{opacity:.55;font-size:10px}
button:disabled{opacity:.4;pointer-events:none}
.log{font-size:9px;color:var(--muted);background:#010409;border:1px solid var(--border);border-radius:5px;padding:6px 8px;height:78px;overflow-y:auto;line-height:1.35;flex-shrink:0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;justify-content:center;align-items:center;z-index:9999;padding:14px}
.modal.show{display:flex}
.modal-box{background:var(--panel);border:2px solid var(--yellow);border-radius:8px;padding:14px;width:100%;max-width:360px;max-height:88vh;overflow-y:auto}
.modal-box h3{font-size:13px;margin-bottom:8px}
.modal-box p{font-size:11px;line-height:1.45;color:#b1bac4;margin-bottom:8px}
.modal-box .row{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.inv-row{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border);border-radius:4px;padding:7px 8px;margin-bottom:5px;font-size:11px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#161b22;border:1px solid var(--blue);color:var(--text);padding:9px 14px;border-radius:6px;font-size:11px;z-index:10000;opacity:0;transition:opacity .2s;pointer-events:none;max-width:92%;text-align:center}
.toast.show{opacity:1}
.hp-ok{color:var(--green)}.hp-mid{color:var(--yellow)}.hp-low{color:var(--red)}
.tag{font-size:9px;opacity:.7}
.ach{font-size:11px;padding:6px 0;border-bottom:1px solid var(--border)}
.ach.done{color:var(--green)}
#boot{position:fixed;inset:0;background:var(--bg);z-index:20000;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;text-align:center}
#boot h2{color:var(--yellow);font-size:16px;margin-bottom:10px}
#boot p{font-size:11px;color:var(--muted);line-height:1.5;margin-bottom:16px;max-width:320px}
#boot input{width:80%;background:#161b22;border:1px solid var(--border);color:var(--text);padding:10px;border-radius:5px;font-family:inherit;font-size:12px;margin-bottom:12px;text-align:center}
</style>
</head>
<body>
<div id="boot">
  <h2>🏛️ УСТАНОВА №31</h2>
  <p>Ти потрапив у колонію. Виживай, заробляй авторитет, не здохни з голоду.<br><br>Збереження автоматичне. У кожного — свій прогрес.</p>
  <input id="name-in" type="text" maxlength="16" placeholder="Прізвисько (необов'язково)" autocomplete="off">
  <button class="primary" style="width:80%;text-align:center;padding:14px" onclick="startGame(false)">▶ ПРОДОВЖИТИ / НОВА ГРА</button>
  <button class="muted" style="width:80%;text-align:center;margin-top:8px" onclick="startGame(true)">Скинути збереження</button>
</div>
<header>
  <h1>🏛️ УСТАНОВА №31 · ДЕНЬ <span id="d">1</span></h1>
  <div id="time-phase">Етап: —</div>
</header>
<div class="stats">
  <div class="stat"><div class="stat-top"><span>❤️</span><b id="s-hp" class="hp-ok">100</b></div><div class="bar"><i id="bar-hp" style="width:100%;background:var(--green)"></i></div></div>
  <div class="stat"><div class="stat-top"><span>🍞</span><b id="s-food" style="color:var(--yellow)">80</b></div><div class="bar"><i id="bar-food" style="width:80%;background:var(--yellow)"></i></div></div>
  <div class="stat"><div class="stat-top"><span>💵</span><b id="s-money" style="color:var(--green)">150</b></div></div>
  <div class="stat"><div class="stat-top"><span>💪</span><b id="s-str" style="color:var(--blue)">10</b></div></div>
  <div class="stat"><div class="stat-top"><span>⭐</span><b id="s-auth" style="color:var(--blue)">5</b></div></div>
  <div class="stat"><div class="stat-top"><span>🛡️</span><b id="s-caste" style="color:var(--purple)">Мужик</b></div></div>
</div>
<div class="screen">
  <div class="loc-title" id="loc">—</div>
  <div class="desc" id="desc">—</div>
  <div class="actions" id="acts"></div>
</div>
<div class="log" id="log">[Система] Двигун запущено.<br></div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="modal-box" id="mbox"></div></div>
<script>
const SK='u31_full_v5';
const PHASES=['Ранкова перевірка','Промзона / робота','Двір / вільний час','Вечір у бараку','Нічний відбій'];
const ITEMS={
  cigarettes:{n:'Цигарки',p:35,d:'+1⭐'},
  foodpack:{n:'Пакунок їжі',p:40,d:'+40🍞'},
  tea:{n:'Чай',p:50,d:'+3⭐'},
  medkit:{n:'Аптечка',p:65,d:'+30❤️'},
  knife:{n:'Заточка',p:110,d:'+6 у бою'},
  vodka:{n:'Брага',p:80,d:'+2⭐ −10❤️ +15🍞'},
  paper:{n:'Папір',p:25,d:'Для маляви'},
  soap:{n:'Мило',p:20,d:'+8❤️'},
  boots:{n:'Берці',p:90,d:'−2 голоду/день'},
  radio:{n:'Радіо',p:75,d:'Новини зони'},
  book:{n:'Книжка',p:30,d:'+1⭐ ввечері'},
  tobacco:{n:'Тютюн',p:45,d:'+2⭐ або обмін'}
};
const ACH=[
  {id:'d7',t:'Тиждень за ґратами',c:()=>P.day>=7},
  {id:'d30',t:'Місяць у зоні',c:()=>P.day>=30},
  {id:'str25',t:'Качок',c:()=>P.str>=25},
  {id:'auth20',t:'Поважають',c:()=>P.auth>=20},
  {id:'blat',t:'Блатний',c:()=>P.caste==='Блатний'},
  {id:'f5',t:"П'ять боїв",c:()=>P.fights>=5},
  {id:'rich',t:'Кишені повні',c:()=>P.money>=500},
  {id:'escape',t:'Втікач',c:()=>P.flags.escaped},
  {id:'throne',t:'Пахан',c:()=>P.flags.throne},
  {id:'quest3',t:'Виконавець',c:()=>P.questsDone>=3},
  {id:'ally',t:'Свій серед чужих',c:()=>P.npc.kolya>=3},
  {id:'story',t:'Історія зони',c:()=>Object.keys(P.story).length>=5}
];

const DESC={
  0:[
    'Шеренга на холодному плацу. Наглядачі рахують голови.',
    'Вітер ріже обличчя. Хтось кашляє в строю.',
    'Сніг/пил під ногами. «Рівняйсь!» — і тишина.',
    'Новий наглядач сьогодні — нервовий, шукає привід.'
  ],
  1:[
    'Станки, пил, бригадир з палицею. План — святе.',
    'Цех гуде. Хтось уже «зробив норму» і курить у кутку.',
    'Пахне мастилом і потом. Зміна тягнеться.',
    'Бригадир у поганому гуморі — краще не світитись.'
  ],
  2:[
    'Ларьок відкритий. На лавках — свої і чужі.',
    'Двір гучний: хтось грає в кістки, хтось сперечається.',
    'Сонце/хмари над колючкою. Короткий ковток «волі».',
    'Сьогодні багато «нових» — атмосфера напружена.'
  ],
  3:[
    'Чай, маляви, тихі розмови. Завтра знову плац.',
    'У бараку пахне цигарками і супом.',
    'Хтось розказує байки з волі. Хтось мовчить.',
    'Електрика моргає. Ніч близько.'
  ],
  4:[
    'Відбій. Темрява. Хтось хропе, хтось шепочеться.',
    'Камера дихає сном і страхом.',
    'За вікном прожектор. Тиша важка.',
    'Думки не дають заснути з першого разу.'
  ]
};

let P={
  day:1,phase:0,hp:100,food:80,str:10,auth:5,money:150,
  caste:'Мужик',inv:{},debt:0,fights:0,escapes:0,
  shizo:0,quest:null,flags:{},snd:true,seenTut:false,
  name:'',questsDone:0,ach:{},
  npc:{kolya:0,med:0,brig:0},
  story:{},
  recentEv:[],
  enemy:0
};

let busy=false,actx=null;
function beep(f=440,t=.04,type='square',v=.04){
  if(!P.snd)return;
  try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain();
    o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(v,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+t);
    o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+t);
  }catch(e){}
}
function click(){beep(420,.035)}
function ok(){beep(620,.07)}
function bad(){beep(110,.18,'sawtooth',.06);try{navigator.vibrate&&navigator.vibrate(40)}catch(e){}}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function chance(p){return Math.random()<p}
function lock(){if(busy)return true;busy=true;setTimeout(()=>busy=false,280);return false}
function pick(arr){return arr[rnd(0,arr.length-1)]}
function flag(k){return !!P.flags[k]}
function setFlag(k,v){P.flags[k]=v!==undefined?v:true}
function story(k){if(!P.story[k]){P.story[k]=1;return true}return false}

function log(m){const el=document.getElementById('log');el.innerHTML+=`[Д${P.day}] ${m}<br>`;el.scrollTop=el.scrollHeight}
function toast(m,ms=2000){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),ms)}
function save(){try{localStorage.setItem(SK,JSON.stringify(P))}catch(e){}}
function load(){
  try{
    let r=localStorage.getItem(SK);
    if(!r){r=localStorage.getItem('u31_full_v4')||localStorage.getItem('u31_full_v3')}
    if(r){
      const d=JSON.parse(r);
      Object.assign(P,d);
      P.npc=P.npc||{kolya:0,med:0,brig:0};
      P.story=P.story||{};
      P.recentEv=P.recentEv||[];
      P.ach=P.ach||{};
      P.flags=P.flags||{};
      return true;
    }
  }catch(e){}
  return false;
}
function inv(id){return P.inv[id]||0}
function add(id,n=1){P.inv[id]=(P.inv[id]||0)+n}
function take(id,n=1){if(inv(id)<n)return false;P.inv[id]-=n;if(P.inv[id]<=0)delete P.inv[id];return true}
function updCaste(){
  if(P.auth>=35)P.caste='Блатний';
  else if(P.auth>=22)P.caste='Авторитет';
  else if(P.auth>=12)P.caste='Міцний мужик';
  else if(P.auth>=0)P.caste='Мужик';
  else P.caste='Опущений';
}
function disc(){
  if(P.caste==='Блатний')return.25;
  if(P.caste==='Авторитет')return.15;
  if(P.caste==='Міцний мужик')return.08;
  return 0;
}
function checkAch(){
  ACH.forEach(a=>{
    if(!P.ach[a.id]&&a.c()){P.ach[a.id]=true;log('🏆 '+a.t);toast('🏆 '+a.t);ok()}
  });
}
function era(){
  if(P.day<=5)return 'newbie';
  if(P.day<=14)return 'settled';
  if(P.day<=29)return 'vet';
  return 'old';
}
function descFor(ph){
  const pool=DESC[ph]||DESC[0];
  return pool[P.day%pool.length];
}

function ui(){
  updCaste();checkAch();
  document.getElementById('d').textContent=P.day;
  let eraLabel={newbie:'Новачок',settled:'Освоївся',vet:'Старожил',old:'Вовк зони'}[era()];
  document.getElementById('time-phase').textContent='Етап: '+PHASES[P.phase]+' · '+eraLabel+(P.name?' · '+P.name:'');
  const hp=document.getElementById('s-hp');
  hp.textContent=P.hp;hp.className=P.hp>60?'hp-ok':P.hp>30?'hp-mid':'hp-low';
  const bhp=document.getElementById('bar-hp');if(bhp){bhp.style.width=P.hp+'%';bhp.style.background=P.hp>60?'var(--green)':P.hp>30?'var(--yellow)':'var(--red)'}
  const fd=document.getElementById('s-food');fd.textContent=P.food;fd.style.color=P.food>40?'var(--yellow)':'var(--red)';
  const bf=document.getElementById('bar-food');if(bf){bf.style.width=P.food+'%';bf.style.background=P.food>40?'var(--yellow)':'var(--red)'}
  document.getElementById('s-money').textContent=P.money+(P.debt>0?`/−${P.debt}`:'');
  document.getElementById('s-str').textContent=P.str;
  document.getElementById('s-auth').textContent=P.auth;
  document.getElementById('s-caste').textContent=P.caste;
  render();save();
}

function render(){
  const A=document.getElementById('acts'),L=document.getElementById('loc'),D=document.getElementById('desc');
  let h='';
  if(P.shizo>0){
    L.textContent='ШІЗО // КАРЦЕР';
    D.textContent=`Штрафний ізолятор. Залишилось днів: ${P.shizo}. Холодно і голодно.`;
    h+=`<button class="primary" onclick="shizoDay()">Пережити день у ШІЗО</button>`;
    h+=`<button onclick="openInv()">📦 Інвентар</button>`;
    A.innerHTML=h;return;
  }

  if(P.phase===0){
    L.textContent='ПЛАЦ // ПЕРЕВІРКА';
    D.textContent=descFor(0);
    h+=`<button onclick="aStand()">Вистояти перевірку</button>`;
    h+=`<button class="primary" onclick="aBribe()">Хабар (−35💵)</button>`;
    if(P.auth>=8)h+=`<button class="special" onclick="aSkipLine()">Встати з «правильними»</button>`;
    if(era()!=='newbie'&&chance(.01)){} // noop
  } else if(P.phase===1){
    L.textContent='ПРОМЗОНА // ЦЕХ';
    D.textContent=descFor(1);
    h+=`<button onclick="aWork()">Працювати (+$ −🍞)</button>`;
    h+=`<button onclick="aGym()">Качалка (+💪)</button>`;
    h+=`<button class="special" onclick="aLeft()">Ліве (ризик)</button>`;
    if(P.str>=18)h+=`<button class="success" onclick="aHardWork()">Важка робота</button>`;
    if(P.day>=4)h+=`<button onclick="aKitchen()">Кухня / наряди</button>`;
    if(P.npc.brig>=2)h+=`<button class="special" onclick="aBrigJob()">Завдання бригадира</button>`;
  } else if(P.phase===2){
    L.textContent='ДВІР // ПРОГУЛЯНКА';
    D.textContent=descFor(2);
    h+=`<button onclick="openShop()">🛒 Ларьок</button>`;
    h+=`<button onclick="aTalk()">Авторитети</button>`;
    h+=`<button onclick="aSearch()">Шукати заначки</button>`;
    h+=`<button class="danger" onclick="aFight()">Розборка</button>`;
    h+=`<button class="special" onclick="aGamble()">Карти / кістки</button>`;
    // rotating unique yard options
    const yd=P.day%7;
    if(yd===0)h+=`<button class="success" onclick="aBath()">🛁 Лазня</button>`;
    if(yd===2||yd===5)h+=`<button onclick="aSport()">⚽ Спортмайданчик</button>`;
    if(yd===3)h+=`<button class="special" onclick="aChurch()">⛪ Молитовна</button>`;
    if(P.day>=3)h+=`<button onclick="aKolya()">Поговорити з Колею</button>`;
    if(P.enemy>0)h+=`<button class="danger" onclick="aEnemy()">Конфлікт з «ворогом»</button>`;
    if(P.quest)h+=`<button class="success" onclick="aQuest()">📋 ${P.quest.t}</button>`;
    else h+=`<button class="success" onclick="aGetQuest()">📋 Доручення</button>`;
  } else if(P.phase===3){
    L.textContent='БАРАК // ВЕЧІР';
    D.textContent=descFor(3);
    h+=`<button onclick="aEat()">Поїсти</button>`;
    h+=`<button onclick="aLetter()">Малява</button>`;
    if(inv('radio')>0)h+=`<button class="special" onclick="aRadio()">📻 Радіо</button>`;
    if(inv('book')>0)h+=`<button onclick="aRead()">📖 Читати</button>`;
    if(P.debt>0)h+=`<button class="danger" onclick="aPayDebt()">Борг (${P.debt})</button>`;
    if(P.day>=5&&!flag('met_story1'))h+=`<button class="special" onclick="aStory1()">Історія від сусіда</button>`;
    if(P.day>=12&&flag('met_story1')&&!flag('met_story2'))h+=`<button class="special" onclick="aStory2()">Продовження історії</button>`;
    if(P.day>=20&&flag('met_story2')&&!flag('met_story3'))h+=`<button class="special" onclick="aStory3()">Фінал історії</button>`;
    if(P.day>=6&&P.auth>=10)h+=`<button class="danger" onclick="aEscape()">💀 Втеча</button>`;
    if(P.day>=10&&P.auth>=20&&P.str>=20)h+=`<button class="special" onclick="aThrone()">👑 Пахан</button>`;
    if(P.day%10===0)h+=`<button class="success" onclick="aFilm()">🎬 «Кіно» в клубі</button>`;
  } else if(P.phase===4){
    L.textContent='КАМЕРА // НІЧ';
    D.textContent=descFor(4);
    h+=`<button class="primary" onclick="aSleep()">Спати (+❤️)</button>`;
    h+=`<button onclick="aNightTrain()">Тихе тренування</button>`;
    if(P.npc.kolya>=2&&chance(.3))h+=`<button class="special" onclick="aNightKolya()">Шепіт Колі</button>`;
  }

  h+=`<button onclick="openInv()">📦 Інвентар</button>`;
  h+=`<button onclick="openAch()">📊 Статистика</button>`;
  if(P.phase===2||P.phase===3)h+=`<button class="primary" onclick="next(true)">Далі →</button>`;
  if(P.phase===4)h+=`<button class="muted" onclick="doReset()">Скинути</button>`;
  h+=`<button class="muted" onclick="toggleSnd()">🔊 ${P.snd?'ON':'OFF'}</button>`;
  A.innerHTML=h;
}

function next(){
  if(lock())return;click();
  P.phase++;
  // story beats by day
  if(P.phase===1&&P.day===1&&story('d1')){log('Перший день. Очі встромлені в тебе звідусіль.');}
  if(P.phase===2&&P.day===2&&story('d2')){log('Другий день. Хтось уже запам\'ятав твоє обличчя.');}
  if(P.phase<5&&chance(.34)){eventRand();return}

}

function endDay(){
  P.phase=0;P.day++;
  let hunger=16;if(inv('boots')>0)hunger=14;
  P.food=clamp(P.food-hunger,0,100);
  if(P.debt>0){const i=Math.ceil(P.debt*.08);P.debt+=i;log('Борг +'+i+' → '+P.debt)}
  if(P.food<=0){P.food=0;P.hp=clamp(P.hp-20,0,100);log('Голод (−20❤️)');toast('Голод!')}
  if(P.hp<=0){gameOver('Організм здався.');return}
  // enemy decay / pressure
  if(P.enemy>0&&chance(.2)){P.hp=clamp(P.hp-5,0,100);log('Ворог нагадав про себе (−5❤️)');}
  if(P.day===3)log('Порада: сила допомагає в лівому і боях.');
  if(P.day===7)log('Тиждень. Ти вже не зовсім «перший термін».');
  if(P.day===15)log('Два тижні. Зона стає зрозумілішою.');
  if(P.day===30)log('Місяць. Дехто киває тобі першим.');
  ui();toast('День '+P.day);
}

function gameOver(reason,win){
  if(win&&/волю/.test(reason))setFlag('escaped');
  if(win&&/Пахан/.test(reason))setFlag('throne');
  checkAch();save();
  const achN=Object.keys(P.ach).filter(k=>P.ach[k]).length;
  document.getElementById('mbox').innerHTML=`
    <h3 style="color:${win?'var(--green)':'var(--red)'}">${win?'🏆 КІНЕЦЬ':'💀 КІНЕЦЬ'}</h3>
    <p>${reason}</p>
    <p class="tag">${P.name?P.name+' · ':''}День ${P.day} · ⭐${P.auth} · 💪${P.str} · ${P.caste}<br>
    Бої ${P.fights} · Квести ${P.questsDone} · Історії ${Object.keys(P.story).length} · 🏆${achN}/${ACH.length}</p>
    <div class="row"><button class="primary" style="text-align:center" onclick="localStorage.removeItem('${SK}');location.reload()">Нова гра</button></div>`;

  win?ok():bad();
}

function openInv(){if(lock())return;click();
  const keys=Object.keys(P.inv).filter(k=>P.inv[k]>0);
  let h=`<h3 style="color:var(--blue)">📦 ІНВЕНТАР</h3>`;
  if(!keys.length)h+=`<p class="tag">Порожньо</p>`;
  else keys.forEach(id=>{
    const it=ITEMS[id]||{n:id,d:''};
    const can=['cigarettes','foodpack','medkit','vodka','soap','tea','book','tobacco'].includes(id);
    h+=`<div class="inv-row"><div><b>${it.n}</b> ×${P.inv[id]}<div class="tag">${it.d||''}</div></div>
      ${can?`<button style="width:auto;padding:6px 10px" onclick="useItem('${id}')">Юз</button>`:'<span class="tag">пасив</span>'}</div>`;
  });
  h+=`<button style="margin-top:8px" onclick="closeM()">Закрити</button>`;modal(h);
}
function useItem(id){click();
  if(['knife','boots','radio','paper'].includes(id)){toast('Не так');return}
  if(!take(id))return;
  if(id==='cigarettes'){P.auth+=1;toast('+1⭐')}
  else if(id==='foodpack'){P.food=clamp(P.food+40,0,100);toast('+40🍞')}
  else if(id==='medkit'){P.hp=clamp(P.hp+30,0,100);toast('+30❤️')}
  else if(id==='vodka'){P.auth+=2;P.hp=clamp(P.hp-10,0,100);P.food=clamp(P.food+15,0,100);toast('Брага')}
  else if(id==='soap'){P.hp=clamp(P.hp+8,0,100);toast('+8❤️')}
  else if(id==='tea'){P.auth+=3;toast('+3⭐')}
  else if(id==='book'){P.auth+=1;toast('+1⭐')}
  else if(id==='tobacco'){P.auth+=2;toast('+2⭐')}
  closeM();ui();
}
function openAch(){if(lock())return;click();
  let h=`<h3 style="color:var(--yellow)">📊 СТАТ / 🏆</h3>`;
  ACH.forEach(a=>{h+=`<div class="ach ${P.ach[a.id]?'done':''}">${P.ach[a.id]?'✓':'○'} ${a.t}</div>`});
  h+=`<p class="tag" style="margin-top:8px">День ${P.day} · Бої ${P.fights} · Втечі ${P.escapes}<br>
  Коля ${P.npc.kolya}/5 · Бригадир ${P.npc.brig}/5 · Ворог ${P.enemy}<br>
  Квести ${P.questsDone} · Історії ${Object.keys(P.story).length} · Борг ${P.debt}</p>`;
  h+=`<button style="margin-top:8px" onclick="closeM()">Закрити</button>`;modal(h);
}

function eventRand(){
  const all=[
    {id:'shmon',t:'🚨 ШМОН',d:'Повний обшук.',f:()=>{const l=Math.min(P.money,rnd(25,55));P.money-=l;log('Шмон −'+l);toast('−'+l)}},
    {id:'prop',t:'🤝 ПРОПОЗИЦІЯ',d:'Передати записку.',f:()=>{P.money+=65;P.auth+=1;log('+65 за записку')}},
    {id:'obmin',t:'🚬 ОБМІН',d:'Послуга за річ.',f:()=>{chance(.5)?(add('cigarettes'),toast('+цигарки')):(add('foodpack'),toast('+їжа'));log('Обмін')}},
    {id:'borg',t:'💸 ПОЗИКА',d:'100 під відсотки.',choice:true,yes:()=>{P.money+=100;P.debt+=125;log('Борг 125')},no:()=>{log('Відмовився')}},
    {id:'med',t:'🏥 МЕДЧАСТИНА',d:'Підлататись за 45.',f:()=>{if(P.money>=45&&P.hp<90){P.money-=45;P.hp=clamp(P.hp+25,0,100);P.npc.med++;log('+25❤️');toast('+25❤️')}else log('Медик байдужий')}},
    {id:'chut',t:'📢 ЧУТКИ',d:'Розмови по зоні.',f:()=>{if(P.auth>=12){P.auth+=1;log('Чутки за тебе')}else log('Ти тінь')}},
    {id:'naizd',t:'⚔️ НАЇЗД',d:'Шукають конфлікту.',f:()=>{if(P.str+P.auth>25||chance(.4)){P.auth+=1;log('Відсіч')}else{P.hp=clamp(P.hp-15,0,100);P.enemy++;log('−15❤️');bad()}}},
    {id:'pered',t:'📦 ПЕРЕДАЧА',d:'З волі.',f:()=>{if(chance(.55)){const m=rnd(40,100);P.money+=m;log('Передача +'+m)}else log('Загубили')}},
    {id:'krysa',t:'🐀 КРИСА',d:'Хтось стукає.',f:()=>{if(P.auth>=15){log('Не чіпають');P.auth+=1}else{P.hp=clamp(P.hp-8,0,100);log('Підозра −8');bad()}}},
    {id:'payka',t:'🍞 ПАЙКА',d:'Зайва пайка.',f:()=>{P.food=clamp(P.food+20,0,100);log('+20🍞')}},
    {id:'pidr',t:'🔧 ПІДРОБІТОК',d:'Для «своїх».',f:()=>{if(P.str>=15||P.auth>=10||P.npc.brig>=1){const g=rnd(40,90);P.money+=g;log('+'+g)}else log('Не свій')}},
    {id:'letter_in',t:'✉️ ЛИСТ',d:'Тобі щось написали.',f:()=>{if(chance(.6)){P.auth+=1;P.hp=clamp(P.hp+5,0,100);log('Лист з волі. Тепліше.')}else log('Конверт порожній / цензура')}},
    {id:'newcomer',t:'👤 НОВЕНЬКИЙ',d:'Привезли етап.',f:()=>{if(P.auth>=10){P.auth+=1;log('Новенькі дивляться на тебе з повагою')}else if(chance(.4)){P.hp=clamp(P.hp-5,0,100);log('Новенький вліз у конфлікт поруч (−5)')}else log('Етап розселили')}},
    {id:'weather',t:'🌧️ ПОГОДА',d:'Сильний дощ / мороз.',f:()=>{P.food=clamp(P.food-5,0,100);if(inv('boots')>0){log('Берці врятували ноги')}else{P.hp=clamp(P.hp-5,0,100);log('Погода б\'є по здоров\'ю (−5)')}}},
    {id:'kolya_help',t:'🤝 КОЛЯ',d:'Коля кличе.',once:'kolya_ev',need:()=>P.npc.kolya>=1,f:()=>{P.npc.kolya=Math.min(5,P.npc.kolya+1);add('foodpack');log('Коля підкинув пакунок');toast('+їжа')}},
    {id:'dream',t:'💭 СОН НАЯВУ',d:'Згадка про волю.',f:()=>{if(story('dream'))log('На мить забув, де ти. Потім згадав.');P.hp=clamp(P.hp+3,0,100)}}
  ];
  let pool=all.filter(e=>{
    if(e.once&&flag('ev_'+e.once))return false;
    if(e.need&&!e.need())return false;
    if(P.recentEv.includes(e.id))return false;
    return true;
  });
  if(!pool.length)pool=all.filter(e=>!e.need||e.need());
  const e=pick(pool);
  P.recentEv.push(e.id);if(P.recentEv.length>6)P.recentEv.shift();
  if(e.once)setFlag('ev_'+e.once);
  if(e.choice){
    modal(`<h3 style="color:var(--orange)">${e.t}</h3><p>${e.d}</p>
      <div class="row"><button class="primary" onclick="evYes()">Так</button><button onclick="evNo()">Ні</button></div>`);
    window._yes=()=>{e.yes();closeM();ui()};window._no=()=>{e.no();closeM();ui()};
  }else{
    modal(`<h3 style="color:var(--orange)">${e.t}</h3><p>${e.d}</p>
      <div class="row"><button class="primary" style="text-align:center" onclick="evDo()">ОК</button></div>`);
    window._do=()=>{e.f();closeM();ui()};
  }
}
function evYes(){window._yes&&window._yes()}
function evNo(){window._no&&window._no()}
function evDo(){window._do&&window._do()}
function nightEv(){
  const opts=[
    {t:'Метушня в коридорі',help:()=>{if(chance(.55)){P.auth+=2;P.money+=25;log('Допоміг +2⭐ +25');ok()}else{P.hp=clamp(P.hp-12,0,100);log('Не туди (−12)');bad()}},skip:()=>log('Не висовувався')},
    {t:'Хтось плаче в темряві',help:()=>{P.auth+=1;log('Тихо підтримав. +1⭐');ok()},skip:()=>log('Зробив вигляд що спиш')},
    {t:'Шелестіння біля ліжка',help:()=>{if(chance(.5)){add('cigarettes');log('Знайти дрібницю');toast('+цигарки')}else{P.hp=clamp(P.hp-8,0,100);log('Пастка (−8)');bad()}},skip:()=>log('Не чіпав')}
  ];
  const o=pick(opts);
  modal(`<h3 style="color:var(--yellow)">🌙 НІЧ</h3><p>${o.t}</p>
    <div class="row"><button class="special" onclick="nightHelp()">Реагувати</button><button onclick="nightSkip()">Ігнорувати</button></div>`);
  window._nh=()=>{o.help();P.hp=clamp(P.hp+22,0,100);P.phase++;goPhase()};
  window._ns=()=>{o.skip();P.hp=clamp(P.hp+22,0,100);P.phase++;goPhase()};
}
function nightHelp(){closeM();click();window._nh&&window._nh()}
function nightSkip(){closeM();click();window._ns&&window._ns()}

function modal(html){document.getElementById('mbox').innerHTML=html;document.getElementById('modal').classList.add('show')}
function closeM(){document.getElementById('modal').classList.remove('show')}
function toggleSnd(){P.snd=!P.snd;ui();toast('Звук '+(P.snd?'ON':'OFF'))}
function doReset(){if(confirm('Скинути прогрес?')){localStorage.removeItem(SK);localStorage.removeItem('u31_full_v4');localStorage.removeItem('u31_full_v3');location.reload()}}

function startGame(forceNew){
  if(forceNew){localStorage.removeItem(SK);localStorage.removeItem('u31_full_v4');localStorage.removeItem('u31_full_v3');
    P={day:1,phase:0,hp:100,food:80,str:10,auth:5,money:150,caste:'Мужик',inv:{},debt:0,fights:0,escapes:0,shizo:0,quest:null,flags:{},snd:true,seenTut:false,name:'',questsDone:0,ach:{},npc:{kolya:0,med:0,brig:0},story:{},recentEv:[],enemy:0}}
  else load();
  const ni=document.getElementById('name-in');if(ni&&ni.value.trim())P.name=ni.value.trim().slice(0,16);
  document.getElementById('boot').style.display='none';
  if(!P.seenTut){P.seenTut=true;log('Порада: тримай ситість, качай силу. Знайди Колю у дворі.')}
  ui();
}
