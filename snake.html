<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0e14">
<title>Змійка 2.0</title>
<style>
:root {
  --bg: #0a0e14;
  --panel: #12181f;
  --border: #2a3540;
  --text: #e6edf3;
  --muted: #8b9bab;
  --green: #3dd68c;
  --green2: #26a269;
  --head: #5eead4;
  --food: #f85149;
  --gold: #e3b341;
  --blue: #58a6ff;
  --purple: #bc8cff;
}
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  max-width: 480px;
  margin: 0 auto;
  padding: 8px;
  padding-bottom: env(safe-area-inset-bottom, 8px);
}
header {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 4px 10px;
  flex-shrink: 0;
}
header h1 { font-size: 16px; font-weight: 700; color: var(--green); letter-spacing: 0.5px; }
.hud {
  display: flex;
  gap: 10px;
  font-size: 12px;
  color: var(--muted);
}
.hud b { color: var(--text); font-variant-numeric: tabular-nums; }
#wrap {
  width: 100%;
  aspect-ratio: 1;
  max-height: min(72vw, 420px);
  background: var(--panel);
  border: 2px solid var(--border);
  border-radius: 12px;
  position: relative;
  overflow: hidden;
  touch-action: none;
  flex-shrink: 0;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
}
#overlay {
  position: absolute;
  inset: 0;
  background: rgba(10, 14, 20, 0.88);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 20px;
  z-index: 5;
}
#overlay.hidden { display: none; }
#overlay h2 { font-size: 22px; margin-bottom: 8px; color: var(--green); }
#overlay p { font-size: 13px; color: var(--muted); margin-bottom: 16px; line-height: 1.4; max-width: 280px; }
.btn {
  background: #1a2330;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 22px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  margin: 4px;
  min-width: 140px;
}
.btn.primary { border-color: var(--green); color: var(--green); }
.btn:active { transform: scale(0.97); background: #243040; }
.controls {
  width: 100%;
  margin-top: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}
.row-c { display: flex; gap: 6px; justify-content: center; }
.pad {
  width: 64px;
  height: 52px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-size: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.pad:active { background: #1e2835; border-color: var(--blue); }
.tips {
  margin-top: 8px;
  font-size: 10px;
  color: var(--muted);
  text-align: center;
  line-height: 1.35;
  flex-shrink: 0;
}
.mode-bar {
  display: flex;
  gap: 6px;
  margin-bottom: 8px;
  flex-wrap: wrap;
  justify-content: center;
}
.mode-bar .btn { min-width: auto; padding: 8px 12px; font-size: 12px; }
.mode-bar .btn.on { border-color: var(--blue); color: var(--blue); }
</style>
</head>
<body>

<header>
  <h1>🐍 Змійка 2.0</h1>
  <div class="hud">
    <span>Рахунок <b id="score">0</b></span>
    <span>Рекорд <b id="best">0</b></span>
    <span>Рівень <b id="lvl">1</b></span>
  </div>
</header>

<div id="wrap">
  <canvas id="c"></canvas>
  <div id="overlay">
    <h2 id="title">Змійка 2.0</h2>
    <p id="msg">Збирай їжу, уникай стін і себе.<br>Свайп або кнопки. 🟡 — бонус.</p>
    <div class="mode-bar">
      <button class="btn on" id="m-classic" onclick="setMode('classic')">Класика</button>
      <button class="btn" id="m-wrap" onclick="setMode('wrap')">Без стін</button>
      <button class="btn" id="m-chaos" onclick="setMode('chaos')">Хаос</button>
    </div>
    <button class="btn primary" id="startBtn" onclick="startGame()">▶ Старт</button>
  </div>
</div>

<div class="controls">
  <div class="row-c"><button class="pad" ontouchstart="dir(0,-1,event)" onmousedown="dir(0,-1,event)">▲</button></div>
  <div class="row-c">
    <button class="pad" ontouchstart="dir(-1,0,event)" onmousedown="dir(-1,0,event)">◀</button>
    <button class="pad" ontouchstart="pauseToggle(event)" onmousedown="pauseToggle(event)">⏸</button>
    <button class="pad" ontouchstart="dir(1,0,event)" onmousedown="dir(1,0,event)">▶</button>
  </div>
  <div class="row-c"><button class="pad" ontouchstart="dir(0,1,event)" onmousedown="dir(0,1,event)">▼</button></div>
</div>

<p class="tips">Свайп по полі · 🔴 їжа +1 · 🟡 золото +3 · 🟣 привид 5с · швидкість росте з рівнем</p>

<script>
const COLS = 20, ROWS = 20;
const BEST_KEY = 'snake2_best_v1';
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const titleEl = document.getElementById('title');
const msgEl = document.getElementById('msg');

let cell = 20, W, H;
let snake, dirV, nextDir, food, bonus, score, best, level, tickMs, alive, paused, mode;
let ghostUntil = 0;
let loopId = null;
let lastTick = 0;
let particles = [];

best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10);
document.getElementById('best').textContent = best;
mode = 'classic';

function resize() {
  const rect = document.getElementById('wrap').getBoundingClientRect();
  const size = Math.floor(Math.min(rect.width, rect.height));
  canvas.width = size;
  canvas.height = size;
  W = size; H = size;
  cell = size / COLS;
  draw();
}
window.addEventListener('resize', resize);
resize();

function setMode(m) {
  mode = m;
  document.querySelectorAll('.mode-bar .btn').forEach(b => b.classList.remove('on'));
  document.getElementById('m-' + m).classList.add('on');
}

function startGame() {
  snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
  dirV = { x: 1, y: 0 };
  nextDir = { x: 1, y: 0 };
  score = 0;
  level = 1;
  tickMs = 140;
  alive = true;
  paused = false;
  ghostUntil = 0;
  particles = [];
  placeFood();
  bonus = null;
  overlay.classList.add('hidden');
  updateHud();
  if (loopId) cancelAnimationFrame(loopId);
  lastTick = performance.now();
  loopId = requestAnimationFrame(loop);
  beep(520, 0.05);
}

function updateHud() {
  document.getElementById('score').textContent = score;
  document.getElementById('lvl').textContent = level;
  document.getElementById('best').textContent = best;
}

function placeFood() {
  let p;
  do {
    p = { x: rnd(0, COLS - 1), y: rnd(0, ROWS - 1) };
  } while (snake.some(s => s.x === p.x && s.y === p.y) || (bonus && bonus.x === p.x && bonus.y === p.y));
  food = p;
}

function placeBonus() {
  if (bonus || Math.random() > 0.28) return;
  let p, tries = 0;
  do {
    p = { x: rnd(0, COLS - 1), y: rnd(0, ROWS - 1), type: Math.random() < 0.55 ? 'gold' : 'ghost', ttl: 40 };
    tries++;
  } while (tries < 30 && (snake.some(s => s.x === p.x && s.y === p.y) || (food.x === p.x && food.y === p.y)));
  if (tries < 30) bonus = p;
}

function rnd(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }

function dir(x, y, e) {
  if (e) e.preventDefault();
  if (!alive) return;
  // no reverse
  if (x === -dirV.x && y === -dirV.y) return;
  if (x === dirV.x && y === dirV.y) return;
  nextDir = { x, y };
}

function pauseToggle(e) {
  if (e) e.preventDefault();
  if (!alive) return;
  paused = !paused;
  if (!paused) {
    lastTick = performance.now();
    loopId = requestAnimationFrame(loop);
  }
  draw();
}

// Keyboard
window.addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'ArrowUp' || k === 'w' || k === 'W') dir(0, -1, e);
  else if (k === 'ArrowDown' || k === 's' || k === 'S') dir(0, 1, e);
  else if (k === 'ArrowLeft' || k === 'a' || k === 'A') dir(-1, 0, e);
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') dir(1, 0, e);
  else if (k === ' ' || k === 'p' || k === 'P') { e.preventDefault(); pauseToggle(); }
  else if ((k === 'Enter' || k === ' ') && !alive) startGame();
});

// Swipe
let tx, ty;
canvas.addEventListener('touchstart', e => {
  const t = e.changedTouches[0];
  tx = t.clientX; ty = t.clientY;
}, { passive: true });
canvas.addEventListener('touchend', e => {
  const t = e.changedTouches[0];
  const dx = t.clientX - tx, dy = t.clientY - ty;
  if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
  if (Math.abs(dx) > Math.abs(dy)) dir(dx > 0 ? 1 : -1, 0);
  else dir(0, dy > 0 ? 1 : -1);
}, { passive: true });

function loop(now) {
  if (!alive || paused) { draw(); return; }
  if (now - lastTick >= tickMs) {
    lastTick = now;
    step();
  }
  // particles
  particles = particles.filter(p => {
    p.life -= 1;
    p.x += p.vx; p.y += p.vy;
    return p.life > 0;
  });
  draw();
  loopId = requestAnimationFrame(loop);
}

function step() {
  dirV = nextDir;
  let nx = snake[0].x + dirV.x;
  let ny = snake[0].y + dirV.y;

  if (mode === 'wrap' || mode === 'chaos') {
    if (nx < 0) nx = COLS - 1;
    if (nx >= COLS) nx = 0;
    if (ny < 0) ny = ROWS - 1;
    if (ny >= ROWS) ny = 0;
  } else {
    if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) return die();
  }

  const hitSelf = snake.some((s, i) => i > 0 && s.x === nx && s.y === ny);
  const ghost = performance.now() < ghostUntil;
  if (hitSelf && !ghost) return die();

  snake.unshift({ x: nx, y: ny });

  let grew = false;
  if (nx === food.x && ny === food.y) {
    score += 1;
    grew = true;
    spawnBurst(food.x, food.y, '#f85149');
    beep(660, 0.04);
    placeFood();
    placeBonus();
    if (score % 5 === 0) {
      level++;
      tickMs = Math.max(55, 140 - (level - 1) * 8);
      if (mode === 'chaos') tickMs = Math.max(50, tickMs - 5);
      beep(880, 0.06);
    }
  }

  if (bonus && nx === bonus.x && ny === bonus.y) {
    if (bonus.type === 'gold') {
      score += 3;
      spawnBurst(bonus.x, bonus.y, '#e3b341');
      beep(780, 0.05);
    } else {
      ghostUntil = performance.now() + 5000;
      spawnBurst(bonus.x, bonus.y, '#bc8cff');
      beep(440, 0.08);
    }
    bonus = null;
  }

  if (bonus) {
    bonus.ttl--;
    if (bonus.ttl <= 0) bonus = null;
  }

  if (!grew) snake.pop();
  updateHud();
}

function die() {
  alive = false;
  if (score > best) {
    best = score;
    localStorage.setItem(BEST_KEY, String(best));
  }
  updateHud();
  titleEl.textContent = 'Гра закінчена';
  msgEl.innerHTML = `Рахунок: <b style="color:var(--green)">${score}</b> · Рекорд: <b>${best}</b><br>Рівень ${level}`;
  document.getElementById('startBtn').textContent = '↻ Ще раз';
  overlay.classList.remove('hidden');
  beep(120, 0.2, 'sawtooth');
}

function spawnBurst(gx, gy, color) {
  const cx = (gx + 0.5) * cell, cy = (gy + 0.5) * cell;
  for (let i = 0; i < 8; i++) {
    const a = (Math.PI * 2 * i) / 8;
    particles.push({
      x: cx, y: cy,
      vx: Math.cos(a) * 2.2, vy: Math.sin(a) * 2.2,
      life: 12, color
    });
  }
}

function draw() {
  ctx.fillStyle = '#0d1218';
  ctx.fillRect(0, 0, W, H);

  // grid subtle
  ctx.strokeStyle = 'rgba(42,53,64,0.35)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= COLS; i++) {
    ctx.beginPath();
    ctx.moveTo(i * cell, 0);
    ctx.lineTo(i * cell, H);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, i * cell);
    ctx.lineTo(W, i * cell);
    ctx.stroke();
  }

  if (!snake) return;

  // food
  drawCell(food.x, food.y, '#f85149', true);
  // bonus
  if (bonus) {
    const col = bonus.type === 'gold' ? '#e3b341' : '#bc8cff';
    drawCell(bonus.x, bonus.y, col, true);
    // blink when expiring
    if (bonus.ttl < 12 && bonus.ttl % 2 === 0) {
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      roundRect(bonus.x * cell + 2, bonus.y * cell + 2, cell - 4, cell - 4, 4);
      ctx.fill();
    }
  }

  // snake
  const ghost = performance.now() < ghostUntil;
  snake.forEach((s, i) => {
    const t = i / Math.max(1, snake.length - 1);
    let col;
    if (i === 0) col = ghost ? '#c4b5fd' : '#5eead4';
    else col = ghost ? `rgba(167,139,250,${0.9 - t * 0.5})` : lerpColor('#3dd68c', '#1a4d3a', t);
    drawCell(s.x, s.y, col, i === 0);
  });

  // eyes on head
  if (snake.length) {
    const h = snake[0];
    const cx = h.x * cell, cy = h.y * cell;
    ctx.fillStyle = '#0a0e14';
    const ex = dirV.x !== 0 ? (dirV.x > 0 ? 0.65 : 0.2) : 0.35;
    const ey = dirV.y !== 0 ? (dirV.y > 0 ? 0.65 : 0.2) : 0.35;
    const ox = dirV.x === 0 ? 0.22 : 0;
    const oy = dirV.y === 0 ? 0.22 : 0;
    ctx.beginPath();
    ctx.arc(cx + (ex) * cell, cy + (ey - oy) * cell, cell * 0.08, 0, Math.PI * 2);
    ctx.arc(cx + (ex + ox) * cell, cy + (ey + (dirV.y === 0 ? oy : 0)) * cell, cell * 0.08, 0, Math.PI * 2);
    ctx.fill();
  }

  particles.forEach(p => {
    ctx.globalAlpha = p.life / 12;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  });

  if (paused && alive) {
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#e6edf3';
    ctx.font = `bold ${Math.floor(cell * 1.2)}px system-ui`;
    ctx.textAlign = 'center';
    ctx.fillText('ПАУЗА', W / 2, H / 2);
  }

  if (ghost && alive) {
    ctx.fillStyle = 'rgba(188,140,255,0.15)';
    ctx.fillRect(0, 0, W, 4);
  }
}

function drawCell(x, y, color, round) {
  ctx.fillStyle = color;
  const pad = 1.5;
  if (round) roundRect(x * cell + pad, y * cell + pad, cell - pad * 2, cell - pad * 2, cell * 0.22);
  else roundRect(x * cell + pad, y * cell + pad, cell - pad * 2, cell - pad * 2, cell * 0.15);
  ctx.fill();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function lerpColor(a, b, t) {
  const pa = hex(a), pb = hex(b);
  const r = Math.round(pa[0] + (pb[0] - pa[0]) * t);
  const g = Math.round(pa[1] + (pb[1] - pa[1]) * t);
  const bl = Math.round(pa[2] + (pb[2] - pa[2]) * t);
  return `rgb(${r},${g},${bl})`;
}
function hex(h) {
  const n = h.replace('#', '');
  return [parseInt(n.slice(0, 2), 16), parseInt(n.slice(2, 4), 16), parseInt(n.slice(4, 6), 16)];
}

let actx;
function beep(f, t, type = 'square') {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.04, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + t);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + t);
  } catch (e) {}
}

// initial draw empty grid
draw();
</script>
</body>
</html>
